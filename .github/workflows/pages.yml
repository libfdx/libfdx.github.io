name: Pages

on:
  workflow_dispatch:
    inputs:
      libfdx_ref:
        description: Published libFDX branch, tag or commit. Defaults to the latest successful snapshot.
        required: false
  schedule:
    - cron: '17,47 * * * *'
  repository_dispatch:
    types:
      - pages
      - project-generator-pages
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.select.outputs.ref }}
      published: ${{ steps.select.outputs.published }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - id: select
        name: Select the verified libFDX revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.libfdx_ref || github.event.client_payload.ref }}
        run: |
          published=$(gh api 'repos/libfdx/libfdx/actions/workflows/workflow_snapshot.yml/runs?branch=master&event=push&status=success&per_page=1' --jq '.workflow_runs[0].head_sha')
          [[ "$published" =~ ^[0-9a-f]{40}$ ]]
          ref=${REQUESTED_REF:-$published}
          git check-ref-format "refs/tags/$ref"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            url="https://libfdx.github.io/last-verified-snapshot.txt?run=$GITHUB_RUN_ID"
            status=$(curl --silent --show-error --location --retry 3 --output previous --write-out '%{http_code}' "$url")
            case "$status" in
              200) if [[ "$(cat previous)" == "$published" ]]; then exit 0; fi ;;
              404) ;;
              *) echo "Reading the deployed snapshot returned HTTP $status"; exit 1 ;;
            esac
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: revision
    if: needs.revision.outputs.deploy == 'true'
    env:
      LIBFDX_REF: ${{ needs.revision.outputs.ref }}
    name: Build and Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          path: website

      - name: Checkout libfdx source
        uses: actions/checkout@v6
        with:
          repository: libfdx/libfdx
          ref: ${{ env.LIBFDX_REF }}
          path: source

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Stage Pages web outputs
        working-directory: source
        run: |
          chmod +x ./gradlew
          ./gradlew :libfdx:tools:project-generator:platform:desktop:test_export_project --console=plain
          starter=libfdx/tools/project-generator/platform/desktop/build/tmp/project-generator-export-smoke/base-starter-project
          version=$(sed -n 's/^libfdxVersion=//p' "$starter/gradle.properties")
          [[ -n "$version" ]]
          if grep -Fxq 'libfdxGeneratorChannel=snapshot' "$starter/gradle.properties"; then
            sha=$(git rev-parse HEAD)
            [[ "$version" == "${sha:0:8}-SNAPSHOT" ]]
          fi
          ./gradlew -p "$starter" :core:classes :platform:desktop:classes

          repo="$RUNNER_TEMP/pages-maven"
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get \
            "-Dmaven.repo.local=$repo" "-Dartifact=io.github.libfdx:fdx_web:$version" -Dtransitive=false \
            -DremoteRepositories=https://central.sonatype.com/repository/maven-snapshots/
          runtime=libfdx/framework/fdx/platform/web/build/generated/resources/runtimeFdxWeb
          mkdir -p "$runtime"
          unzip -o "$repo/io/github/libfdx/fdx_web/$version/fdx_web-$version.jar" fdx.js fdx.wasm -d "$runtime"
          ./gradlew stage_pages -x :libfdx:framework:fdx:platform:web:generate_runtime_fdx_web_native --console=plain
          cmp "$runtime/fdx.js" build/pages/project-generator/scripts/fdx.js
          cmp "$runtime/fdx.wasm" build/pages/project-generator/scripts/fdx.wasm
          echo "$version" > build/pages/project-generator/libfdx-version.txt

      - name: Compose Pages site
        env:
          VERIFIED_SNAPSHOT: ${{ needs.revision.outputs.published }}
        run: |
          rm -rf site
          mkdir -p site
          rsync -a --delete --exclude='.git' --exclude='.github' website/ site/
          cp -a source/build/pages/. site/
          echo "$VERIFIED_SNAPSHOT" > site/last-verified-snapshot.txt
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
